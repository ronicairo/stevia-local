version: '3.8'

# =============================================================
# Stack locale Stevia — soutenance thèse
# Lancer depuis : stevia-local/
#   podman-compose up -d
# App Symfony séparée : symfony serve --port=8000
# =============================================================

services:

  # -----------------------------------------------------------
  # 1. PostgreSQL 16 + pgvector (base vectorielle)
  # -----------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres-stevia
    restart: unless-stopped
    environment:
      POSTGRES_USER:     stevia
      POSTGRES_PASSWORD: steviapassword
      POSTGRES_DB:       stevia
    ports:
      - "5432:5432"
    volumes:
      - stevia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stevia"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------
  # 2. Ollama — inférence LLM
  #    LOCAL : commenté — Ollama tourne nativement sur macOS (GPU M5)
  #    PROD  : décommenter ce bloc pour Ollama en conteneur
  # -----------------------------------------------------------
  # ollama:
  #   image: ollama/ollama
  #   container_name: ollama
  #   restart: unless-stopped
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama

  # -----------------------------------------------------------
  # 3. BookStack — documentation source (port 8080)
  # -----------------------------------------------------------
  bookstack-db:
    image: mysql:8.0
    container_name: bookstack-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE:      bookstack
      MYSQL_USER:          bookstack
      MYSQL_PASSWORD:      bookstackpassword
    volumes:
      - bookstack_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "bookstack", "-pbookstackpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  bookstack:
    image: linuxserver/bookstack
    container_name: bookstack
    restart: unless-stopped
    depends_on:
      bookstack-db:
        condition: service_healthy
    environment:
      PUID:        1000
      PGID:        1000
      TZ:          Europe/Paris
      APP_URL:     http://localhost:8080
      APP_KEY:     base64:MmNiZTBlYjA5ZWUzNDgzNWE5ZjBjMWM5ZThkMjY0ZGI=
      DB_HOST:     bookstack-db
      DB_PORT:     3306
      DB_USER:     bookstack
      DB_PASS:     bookstackpassword
      DB_DATABASE: bookstack
    ports:
      - "8080:80"
    volumes:
      - bookstack_data:/config

  # -----------------------------------------------------------
  # 4. Stevia API — backend FastAPI + RAG + ML
  #    Source : src/Stevia/
  # -----------------------------------------------------------
  stevia-api:
    build:
      context: ./src/Stevia
      dockerfile: Dockerfile
    container_name: stevia-container
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./src/Stevia/.env
    ports:
      - "8001:8001"
    volumes:
      - stevia_tmp:/app/stevia_work/tmp
      # Classifieur ML — monté depuis src/Stevia/ml/
      - ./src/Stevia/ml:/app/ml
      # Logs persistants dans var/log/ (partagés avec Monolog Symfony)
      - ./var/log:/app/var/log

# =============================================================
volumes:
  stevia_postgres_data:
  ollama_data:
  bookstack_db_data:
  bookstack_data:
  stevia_tmp:
